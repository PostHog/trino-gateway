serverConfig:
  node.environment: test
  http-server.http.port: ${ENV:REQUEST_ROUTER_PORT}
  # The deployed shape: a load balancer terminates TLS in front of the Gateway and its
  # X-Forwarded-* headers are dropped by the Gateway's own server rather than trusted.
  http-server.process-forwarded: ignore

includeClusterHostInResponse: true
dataStore:
  jdbcUrl: ${ENV:POSTGRESQL_JDBC_URL}
  user: ${ENV:POSTGRESQL_USER}
  password: ${ENV:POSTGRESQL_PASSWORD}
  driver: org.postgresql.Driver

clusterStatsConfiguration:
  monitorType: INFO_API

monitor:
  taskDelay: 1s

routing:
  forwardedProto: https
  forwardedPort: 443

extraWhitelistPaths:
  - '/v1/custom.*'
