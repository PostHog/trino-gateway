name: Transaction awareness tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transaction-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: PostgreSQL transaction ledger and protocol adapter
        env:
          TX_STORE_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          TX_STORE_TEST_USERNAME: postgres
        run: >-
          ./mvnw -B -ntp -pl gateway-ha -am test
          -Dskip.installnodepnpm -Dskip.pnpm
          '-Dtest=TestTransaction*,TestStrictProxyResponseHandler,TestDatabaseDeadline,TestJdbcConnectionManager'
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Protocol and network fault fixture self-tests
        working-directory: testing/transaction-awareness
        run: python3 -m unittest -v test_fake_trino test_network_fault_proxy test_load_open_loop test_load_executor_setup test_load_client_cpu test_load_error_categories test_load_multiprocess test_load_aggregate test_load_cutover test_load_cutover_aggregate test_load_checkpoints test_database_metrics test_protocol_tls test_matrix_case test_fault_recovery test_rollout_client test_rollout_workload test_manual_cutover_smoke
      - name: Multi-process rollout administration HTTP contracts
        run: |
          ./mvnw -B -ntp -pl gateway-ha dependency:build-classpath -Dmdep.outputFile=/tmp/gateway-rollout-classpath
          export GATEWAY_TEST_CLASSPATH="$PWD/gateway-ha/target/classes:$(cat /tmp/gateway-rollout-classpath)"
          export GATEWAY_TEST_JAVA="$JAVA_HOME/bin/java"
          export GATEWAY_TEST_PG_BIN="$(pg_config --bindir)"
          cd testing/transaction-awareness
          python3 -m unittest -v test_rollout_api test_graceful_shutdown test_pool_lifecycle test_whole_query_cancel
      - name: Disposable lab tooling tests
        working-directory: testing/transaction-awareness/deploy
        env:
          TX_OBSERVER_LOCAL_PG: "yes"
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
          PGDATABASE: postgres
          PGUSER: postgres
        run: |
          psql --version
          python3 -m unittest discover -p 'test_*.py' -v
