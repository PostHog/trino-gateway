name: Publish ECR image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-ecr-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -Eeuo pipefail {0}

env:
  IMAGE_NAME: trino-gateway
  AWS_REGION: us-east-1

jobs:
  publish:
    if: github.repository == 'PostHog/trino-gateway' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require publish role
        if: vars.TRINO_GATEWAY_AWS_ECR_PUBLISH_IAM_ROLE == ''
        run: |
          echo "::error::Set the repository variable TRINO_GATEWAY_AWS_ECR_PUBLISH_IAM_ROLE to the GitHub OIDC publish role ARN"
          exit 1

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Build application
        run: ./mvnw -B -ntp install -DskipTests -Dmaven.source.skip=true -Dair.check.skip-all

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: amd64,arm64

      - name: Build and test both architectures
        env:
          TRINO_GATEWAY_IMAGE_SOURCE: https://github.com/${{ github.repository }}
          TRINO_GATEWAY_IMAGE_REVISION: ${{ github.sha }}
        run: docker/build.sh

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.22.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.TRINO_GATEWAY_AWS_ECR_PUBLISH_IAM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Publish and verify image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image="${ECR_REGISTRY}/${IMAGE_NAME}"
          source_url="https://github.com/${GITHUB_REPOSITORY}"
          version=$(<trino-gateway-version.txt)
          tag="sha-${GITHUB_SHA}"
          reference="${image}:${tag}"

          verify_index() {
            local digest=$1
            crane manifest "${image}@${digest}" | jq -e \
              '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]'
            for arch in amd64 arm64; do
              crane config --platform "linux/${arch}" "${image}@${digest}" | jq -e \
                --arg source "$source_url" --arg revision "$GITHUB_SHA" \
                '.config.Labels["org.opencontainers.image.source"] == $source and .config.Labels["org.opencontainers.image.revision"] == $revision'
            done
          }

          # The repository enforces tag immutability. A rerun for a commit that
          # already has an image must not push different bytes under the same tag.
          if digest=$(crane digest "$reference" 2>/dev/null); then
            echo "::notice::${reference} already exists; verifying the published image instead of pushing"
            verify_index "$digest"
            {
              printf 'Already published `%s`\n\n' "$reference"
              printf 'Pin deployments to `%s@%s`.\n' "$image" "$digest"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          publish_tmp=$(mktemp -d)
          manifests=()
          for arch in amd64 arm64; do
            docker save "trino-gateway:${version}-${arch}" -o "${publish_tmp}/${arch}.tar"
            arch_digest=$(crane digest --tarball "${publish_tmp}/${arch}.tar")
            crane push "${publish_tmp}/${arch}.tar" "${image}@${arch_digest}" --image-refs "${publish_tmp}/${arch}.ref"
            manifests+=(-m "$(<"${publish_tmp}/${arch}.ref")")
          done

          crane index append "${manifests[@]}" -t "$reference"
          digest=$(crane digest "$reference")
          verify_index "$digest"
          {
            printf 'Published `%s`\n\n' "$reference"
            printf 'Pin deployments to `%s@%s`.\n' "$image" "$digest"
          } >> "$GITHUB_STEP_SUMMARY"
